android {
    defaultConfig {
        applicationId "com.asayuu.com"
        minSdkVersion 26
        targetSdkVersion 30

        // 【版本升级配置】
        // versionCode 必须比旧版本（1）大，系统才允许覆盖安装
        versionCode 3
        // versionName 是你在应用信息里看到的文字
        versionName "2.0"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
}

dependencies {
    // 强制声明编译 libs 目录下的所有 .jar 文件
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
